packages:
  - apps/*
  - packages/*

# Keep registry installs stable in Docker and constrained CI environments.
networkConcurrency: 8
fetchRetries: 5
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 120000

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  deepmerge-ts: 8.0.2
  mysql2: 3.24.5
