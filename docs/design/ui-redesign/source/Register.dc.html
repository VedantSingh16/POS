<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your organisation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F5EF}
a{color:#047857}a:hover{color:#065F46}
.app{font-family:Manrope,system-ui,sans-serif;color:#14201B;font-size:14px;line-height:1.5}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.hint{display:flex;align-items:center;gap:6px;font-size:12px;color:#5B6660;margin-top:6px}
.inp{display:block;width:100%;box-sizing:border-box;height:44px;border:1px solid #CFC8BB;border-radius:8px;padding:0 12px;background:#fff;font:500 15px Manrope,system-ui,sans-serif;color:#14201B}
.inp:focus{outline:none;border-color:#047857;box-shadow:0 0 0 3px rgba(4,120,87,.18)}
.pre{display:flex;align-items:stretch;border:1px solid #CFC8BB;border-radius:8px;background:#fff;overflow:hidden;height:44px;box-sizing:border-box}
.pre span{display:flex;align-items:center;padding:0 10px 0 12px;background:#F2EFE8;color:#5B6660;font-weight:600;border-right:1px solid #E2DDD3}
.pre input{flex:1;min-width:0;border:0;padding:0 12px;font:600 15px Manrope,system-ui,sans-serif;color:#14201B;background:transparent}
.fw{position:relative}
.eye{position:absolute;right:4px;top:4px;height:36px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#2C3A34;font:600 13px Manrope,system-ui,sans-serif;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:8px;font:700 15px Manrope,system-ui,sans-serif;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;box-sizing:border-box}
.bp{background:#047857;color:#fff}.bp:hover{background:#065F46;color:#fff}
.step{width:24px;height:24px;border-radius:99px;background:#047857;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.muted{color:#5B6660}
</style>
</helmet>
<div class="app" style="min-height: 1000px; background: #F7F5EF; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 24px 40px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 34px; height: 34px; border-radius: 9px; background: #047857; color: #fff; display: grid; place-items: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M3 9l1.5-5h15L21 9M3 9h18M4 9v11h16V9M9 20v-6h6v6"></path></svg></span><span style="font-weight: 800; font-size: 18px">DeltCRM</span><span style="font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 2px 6px; border-radius: 5px; background: #E3F2EA; color: #065F46">POS</span></div>
<label style="display: inline-flex; align-items: center; gap: 6px"><span style="position: absolute; left: -9999px">Language</span><select style="border: 1px solid #D9D3C7; border-radius: 8px; height: 34px; padding: 0 8px; font: 600 13px Manrope, system-ui, sans-serif; background: #fff; color: #14201B"><option>English</option><option>العربية</option></select></label>
</header>
<main style="flex: 1; display: flex; justify-content: center; padding: 8px 20px 48px">
<form style="width: 100%; max-width: 720px; background: #fff; border: 1px solid #E6E1D7; border-radius: 12px; padding: 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
<div>
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Create your organisation</h1>
<p style="margin: 6px 0 0" class="muted">Takes about a minute. You’ll add your first store right after.</p>
</div>
<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px"><span class="step">1</span><h2 style="margin: 0; font-size: 16px; font-weight: 800">Your organisation</h2></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px">
<div><label class="lbl" for="r-org">Organisation name</label><input id="r-org" class="inp" value="Jai Hind" autocomplete="organization"></div>
<div><label class="lbl" for="r-slug">Organisation URL</label><div class="pre"><span>deltcrm.app/</span><input id="r-slug" value="jai-hind" autocomplete="off"></div><span class="hint"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; color: #166B47"><path d="M5 12l5 5 9-10"></path></svg>Filled in from the name. You can edit it.</span></div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 16px; padding-top: 24px; border-top: 1px solid #EFEBE3">
<div style="display: flex; align-items: center; gap: 10px"><span class="step">2</span><h2 style="margin: 0; font-size: 16px; font-weight: 800">Your administrator account</h2></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px">
<div><label class="lbl" for="r-first">First name</label><input id="r-first" class="inp" autocomplete="given-name"></div>
<div><label class="lbl" for="r-last">Last name <span class="muted" style="font-weight: 500">(optional)</span></label><input id="r-last" class="inp" autocomplete="family-name"></div>
<div style="grid-column: 1 / -1"><label class="lbl" for="r-email">Work email</label><input id="r-email" class="inp" type="email" placeholder="you@company.com" autocomplete="email"></div>
<div style="grid-column: 1 / -1">
<label class="lbl" for="r-pw">Password</label>
<div class="fw"><input id="r-pw" class="inp" type="password" value="jaihind2" autocomplete="new-password" style="padding-right: 64px"><button class="eye" type="button" aria-label="Show password">Show</button></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px" aria-hidden="true"><div style="height: 4px; border-radius: 99px; background: #C98A1E"></div><div style="height: 4px; border-radius: 99px; background: #C98A1E"></div><div style="height: 4px; border-radius: 99px; background: #E6E1D7"></div><div style="height: 4px; border-radius: 99px; background: #E6E1D7"></div></div>
<span class="hint" style="color: #7A4A00"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18"></path></svg>At least 12 characters. 4 more to go</span>
</div>
</div>
</section>
<div style="display: flex; flex-direction: column; gap: 14px">
<button class="btn bp" type="submit" style="width: 100%">Create organisation</button>
<p style="margin: 0; text-align: center" class="muted">Already have an account? <a href="Login.dc.html" style="font-weight: 700">Sign in</a></p>
</div>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>

return {};
}
}
</script>
</body>
</html>
