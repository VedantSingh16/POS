a{color:#047857}a:hover{color:#065F46}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.seg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;border:1px solid #D9D3C7;border-radius:10px;background:#fff;font:700 14px Manrope,system-ui,sans-serif;color:#14201B;cursor:pointer}
.seg.on{border-color:#047857;background:#F3FAF6;box-shadow:0 0 0 1px #047857;color:#065F46}
.qc{height:44px;border:1px solid #D9D3C7;border-radius:8px;background:#fff;font:700 14px Manrope,system-ui,sans-serif;color:#14201B;cursor:pointer}

.bp{background:#047857;color:#fff}.bp:hover{background:#065F46}
.bo{background:#fff;color:#14201B;border-color:#D9D3C7}

</div>
</div>
